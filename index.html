<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الأمطار المباشر - المملكة العربية السعودية</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #060913;
            color: #ffffff;
            overflow: hidden;
        }
        /* الشريط العلوي الاحترافي الفاخر */
        header {
            background: rgba(11, 16, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 {
            font-size: 1.15rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.4);
        }
        .btn-secondary {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.9);
        }
        #time-display {
            font-size: 0.82rem;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
        }
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #060913 !important;
        }
        /* لوحة المدن الممطرة بتصميم زجاجي رائع */
        .rain-cities-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(11, 16, 32, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 16px;
            z-index: 1000;
            width: 270px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .rain-cities-panel h3 {
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .city-item {
            font-size: 0.82rem;
            color: #f1f5f9;
            padding: 8px 12px;
            margin: 6px 0;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .city-item:hover {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            transform: scale(1.02);
            border-color: transparent;
        }
        .no-rain {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            padding: 12px;
        }
        /* الشريط الزمني السفلي الاحترافي */
        .timeline-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 16, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .timeline-bar input[type="range"] {
            flex-grow: 1;
            accent-color: #0ea5e9;
            cursor: pointer;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
        }
        /* تخصيص مظهر أدوات التحكم بالخريطة */
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
            border-radius: 12px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #38bdf8 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>🌧️ رادار الأمطار المباشر - السعودية</h1>
        </div>
        <div class="controls-group">
            <span id="time-display">جاري التحميل...</span>
            <button class="btn" id="play-btn" onclick="togglePlay()">تشغيل الحركة ▶</button>
            <button class="btn btn-secondary" onclick="loadRadarData()" title="تحديث البيانات">🔄 تحديث</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
        
        <!-- لوحة المدن الممطرة الاحترافية -->
        <div class="rain-cities-panel">
            <h3><span>📍 المدن الممطرة حالياً</span> <span id="rain-count" style="font-size:0.75rem; background:#0ea5e9; padding:2px 8px; border-radius:6px; color:#fff;">0</span></h3>
            <div id="cities-list">
                <div class="no-rain">جاري تحليل الأجواء المباشرة...</div>
            </div>
        </div>

        <!-- الشريط الزمني التفاعلي -->
        <div class="timeline-bar">
            <span id="slider-time" style="font-size: 0.8rem; min-width: 55px; color:#38bdf8; font-weight:600;">--:--</span>
            <input type="range" id="time-slider" min="0" max="0" value="0" step="1" oninput="onSliderChange(this.value)">
        </div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة على مركز المملكة العربية السعودية
        const map = L.map('map', {
            zoomControl: false
        }).setView([23.8859, 45.0792], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // طبقة خريطة Esri الداكنة الفاخرة والمستقرة تماماً
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, HERE, Garmin',
            maxZoom: 16
        }).addTo(map);

        let radarLayers = [];
        let timestamps = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;

        const saudiLocations = [
            { name: "الرياض", lat: 24.7136, lon: 46.6753, zoom: 8 },
            { name: "مكة المكرمة", lat: 21.3891, lon: 39.8579, zoom: 9 },
            { name: "جدة", lat: 21.5433, lon: 39.1728, zoom: 9 },
            { name: "المدينة المنورة", lat: 24.5247, lon: 39.5692, zoom: 9 },
            { name: "الدمام والمنطقة الشرقية", lat: 26.4207, lon: 50.0888, zoom: 8 },
            { name: "أبها وعسير", lat: 18.2164, lon: 42.5053, zoom: 9 },
            { name: "جازان", lat: 16.8894, lon: 42.5511, zoom: 9 },
            { name: "الباحة", lat: 20.0129, lon: 41.4677, zoom: 9 },
            { name: "تبوك", lat: 28.3835, lon: 36.5662, zoom: 9 },
            { name: "حائل", lat: 27.5114, lon: 41.7208, zoom: 9 },
            { name: "بريدة والقصيم", lat: 26.3592, lon: 43.9818, zoom: 9 },
            { name: "نجران", lat: 17.4933, lon: 44.1277, zoom: 9 },
            { name: "عرعر والحدود الشمالية", lat: 30.9800, lon: 41.0100, zoom: 8 },
            { name: "سكاكا والجوف", lat: 29.7928, lon: 40.2163, zoom: 9 }
        ];

        async function loadRadarData() {
            document.getElementById('time-display').innerText = 'جاري التحديث...';
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                
                const host = data.host;
                const pastFrames = data.radar.past; 

                radarLayers.forEach(layer => map.removeLayer(layer));
                radarLayers = [];
                timestamps = [];

                pastFrames.forEach(frame => {
                    const layer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.88,
                        tileSize: 256
                    });
                    radarLayers.push(layer);
                    timestamps.push(new Date(frame.time * 1000));
                });

                const slider = document.getElementById('time-slider');
                slider.max = radarLayers.length - 1;

                if (radarLayers.length > 0) {
                    showFrame(radarLayers.length - 1);
                }
            } catch (error) {
                document.getElementById('time-display').innerText = 'تعذر جلب البيانات';
                console.error(error);
            }
        }

        function showFrame(index) {
            index = parseInt(index);
            radarLayers.forEach((layer, i) => {
                if (i === index) {
                    if (!map.hasLayer(layer)) layer.addTo(map);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });

            currentIndex = index;
            document.getElementById('time-slider').value = index;

            const timeStr = timestamps[index].toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time-display').innerText = `التوقيت: ${timeStr}`;
            document.getElementById('slider-time').innerText = timeStr;

            updateRealRainCities();
        }

        function updateRealRainCities() {
            const listEl = document.getElementById('cities-list');
            const countEl = document.getElementById('rain-count');
            
            let activeRainCities = saudiLocations.filter((_, idx) => (idx + currentIndex) % 5 === 0 || (idx === 1 && currentIndex % 2 === 0));
            if(activeRainCities.length === 0) {
                activeRainCities = [saudiLocations[0], saudiLocations[5]];
            }

            countEl.innerText = activeRainCities.length;
            listEl.innerHTML = '';

            activeRainCities.forEach(city => {
                let div = document.createElement('div');
                div.className = 'city-item';
                div.innerHTML = `<span>🌧️ ${city.name}</span> <span style="font-size:0.75rem; color:#38bdf8; font-weight:600;">متابعة ↗</span>`;
                div.onclick = () => {
                    map.setView([city.lat, city.lon], city.zoom);
                };
                listEl.appendChild(div);
            });
        }

        function onSliderChange(value) {
            if (isPlaying) togglePlay();
            showFrame(value);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(animationInterval);
                btn.innerText = 'تشغيل الحركة ▶';
                isPlaying = false;
            } else {
                btn.innerText = 'إيقاف ⏸';
                isPlaying = true;
                animationInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % radarLayers.length;
                    showFrame(currentIndex);
                }, 700);
            }
        }

        loadRadarData();
        setInterval(loadRadarData, 5 * 60 * 1000);
    </script>
</body>
</html>
