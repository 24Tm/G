<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وتوزيع منسوبي الإدارة</title>
    <!-- استيراد مكتبات Firebase Realtime Database للتزامن السحابي -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.secondary {
            background: #059669;
        }
        button.secondary:hover {
            background: #047857;
        }
        button.warning {
            background: #d97706;
        }
        button.print-btn {
            background: #7c3aed;
        }
        button.print-btn:hover {
            background: #6d28d9;
        }
        .section-title {
            background: #334155;
            color: #38bdf8;
            padding: 8px 12px;
            font-weight: bold;
            margin-top: 15px;
            border-radius: 6px 6px 0 0;
            font-size: 1rem;
            border-bottom: 2px solid #2563eb;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            margin-bottom: 15px;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #1e293b;
            color: #cbd5e1;
        }
        tr:hover {
            background: #273548;
        }
        .exclusion-box {
            background: #1e293b; 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 15px;
        }
        
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0;
            }
            header, .exclusion-box, .controls {
                display: none !important;
            }
            table {
                background: white !important;
                color: black !important;
                border: 1px solid #ddd;
            }
            th, td {
                border-bottom: 1px solid #ddd;
                color: black !important;
            }
            th {
                background: #f1f5f9 !important;
            }
            .section-title {
                background: #e2e8f0 !important;
                color: black !important;
                border-bottom: 2px solid #000;
            }
        }
        body {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📁 نظام هيكلة وتوزيع منسوبي الإدارة</h1>
            <div class="controls">
                <button onclick="renderStructure('default')">الهيكلة الأصلية</button>
                <button class="secondary" onclick="renderStructure('group2')">مجموعتان</button>
                <button class="warning" onclick="renderStructure('group3')">3 مجموعات</button>
                <button onclick="renderStructure('group4')">4 مجموعات</button>
                <button class="secondary" onclick="renderStructure('activeOnly')">العاملون بالداخل</button>
                <button class="print-btn" onclick="window.print()">🖨 طباعة / PDF</button>
            </div>
        </header>

        <div class="exclusion-box">
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px;">إلغاء التحديد أدناه يستبعد الشخص تماماً من التقسيم الآلي:</p>
            <div id="exclusion-list" style="display: flex; flex-wrap: wrap; gap: 10px; max-height: 120px; overflow-y: auto;">
                <!-- يُعبأ تلقائياً -->
            </div>
        </div>

        <div id="content-area"></div>
    </div>

    <script>
        // ==========================================
        // 📌 قاعدة بيانات الأسماء، الرتب، والوظائف
        // يمكنك تعديل الاسم (name)، الرتبة (rank)، التكليف (role)، أو القسم (category) هنا بكل حرية:
        // ==========================================
        const defaultStaff = [
            { id: 1, name: "عبدالرحمن عبدالله الشمراني", rank: "رئيس رقباء", role: "رقيب الإدارة", category: "رقيب الإدارة", notes: "رقيب الادارة" },
            { id: 2, name: "عبدالرحمن سعود البواردي", rank: "رقيب اول", role: "مساعد الرقيب", category: "رقيب الإدارة", notes: "مساعد" },
            { id: 3, name: "عبدالرحمن خالد الحمود", rank: "رقيب اول", role: "مدخل بيانات", category: "شؤون الضباط", notes: "مهام الضباط" },
            { id: 4, name: "أحمد بداي العتيبي", rank: "وكيل رقيب", role: "مدخل بيانات", category: "شؤون الضباط", notes: "مهام الضباط+مراسل" },
            { id: 5, name: "خالد عويتر المطيري", rank: "رقيب اول", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "الترقيات" },
            { id: 6, name: "طلال ناصر العتيبي", rank: "رقيب اول", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 7, name: "محمد عواد المطيري", rank: "رقيب", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 8, name: "خالد شبيب الشيباني", rank: "رقيب", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 9, name: "نهار شعير الحربي", rank: "رقيب", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 10, name: "تركي سلطان العتيبي", rank: "وكيل رقيب", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 11, name: "فهد محسن العتيبي", rank: "عريف", role: "مدخل بيانات", category: "شؤون الأفراد", notes: "مهام أفراد" },
            { id: 12, name: "حمود عوض الله المطيري", rank: "رقيب", role: "ارشيف", category: "الارشيف والمراسلات", notes: "ارشيف" },
            { id: 13, name: "محمد خويتم المطيري", rank: "وكيل رقيب", role: "ارشيف", category: "الارشيف والمراسلات", notes: "ارشيف" },
            { id: 14, name: "تركي مشعل العتيبي", rank: "رقيب", role: "مراسل", category: "الارشيف والمراسلات", notes: "مراسل" },
            { id: 15, name: "عبدالله احمد القحطاني", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 16, name: "عادي ظافر العتيبي", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 17, name: "نواف هادي العتيبي", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 18, name: "محمد ناصر العتيبي", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 19, name: "حسن ضاحي الدوسري", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 20, name: "ظافر سعد الدوسري", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 21, name: "ماجد فيحان الحربي", rank: "رئيس رقباء", role: "مناوب", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 22, name: "بندر محمد المجعد", rank: "رئيس رقباء", role: "مكتب القايد", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 23, name: "عبدالله علي العتيبي", rank: "رقيب", role: "مكتب القايد", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 24, name: "ماهر الحميدي المطيري", rank: "رقيب", role: "مكتب القايد", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 25, name: "ثامر حمود العتيبي", rank: "عريف", role: "خدمات", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" },
            { id: 26, name: "عبدالله سحمان السبيعي", rank: "رئيس رقباء", role: "راحة", category: "لا يقومون بأي اعمال داخل الادارة", notes: "لا يعمل داخل الادارة" }
        ];

        // إعدادات الاتصال السحابي (اختياري للتزامن بين الأجهزة)
        const firebaseConfig = {
            databaseURL: "" 
        };

        let currentMode = 'default';
        let db = null;

        try {
            if(firebaseConfig.databaseURL !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {
            console.log("وضع العمل المحلي");
        }

        function initExclusionCheckboxes() {
            const listDiv = document.getElementById('exclusion-list');
            listDiv.innerHTML = '';
            defaultStaff.forEach(p => {
                listDiv.innerHTML += `
                    <label style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem; cursor: pointer;">
                        <input type="checkbox" id="chk_${p.id}" value="${p.id}" checked onchange="updateExclusions()"> ${p.name.split(' ')[0]} ${p.name.split(' ')[1]}
                    </label>
                `;
            });

            if (db) {
                db.ref('exclusions').on('value', (snapshot) => {
                    const excludedIds = snapshot.val() || [];
                    defaultStaff.forEach(p => {
                        const chk = document.getElementById(`chk_${p.id}`);
                        if (chk) chk.checked = !excludedIds.includes(p.id);
                    });
                    renderStructure(currentMode);
                });
            }
        }

        function updateExclusions() {
            const checkboxes = document.querySelectorAll('#exclusion-list input[type="checkbox"]');
            const excludedIds = Array.from(checkboxes)
                .filter(cb => !cb.checked)
                .map(cb => parseInt(cb.value));

            if (db) {
                db.ref('exclusions').set(excludedIds);
            } else {
                renderStructure(currentMode);
            }
        }

        function getActiveStaff() {
            const checkboxes = document.querySelectorAll('#exclusion-list input[type="checkbox"]');
            const excludedIds = Array.from(checkboxes)
                .filter(cb => !cb.checked)
                .map(cb => parseInt(cb.value));
            
            return defaultStaff.filter(p => !excludedIds.includes(p.id));
        }

        function renderStructure(type) {
            currentMode = type;
            const container = document.getElementById('content-area');
            container.innerHTML = '';
            const activeStaff = getActiveStaff();

            if (type === 'default') {
                const groups = {};
                activeStaff.forEach(person => {
                    if (!groups[person.category]) groups[person.category] = [];
                    groups[person.category].push(person);
                });
                for (let cat in groups) {
                    container.innerHTML += createTableHTML(cat, groups[cat]);
                }
            } else if (type === 'activeOnly') {
                const filtered = activeStaff.filter(p => p.category !== "لا يقومون بأي اعمال داخل الادارة");
                container.innerHTML += createTableHTML("العاملون داخل الإدارة فقط", filtered);
            } else if (type === 'group2' || type === 'group3' || type === 'group4') {
                let numGroups = type === 'group2' ? 2 : (type === 'group3' ? 3 : 4);
                const roleGroups = {};
                activeStaff.forEach(person => {
                    let key = person.role;
                    if (!roleGroups[key]) roleGroups[key] = [];
                    roleGroups[key].push(person);
                });

                let groupsArray = Array.from({ length: numGroups }, () => []);
                for (let role in roleGroups) {
                    let members = roleGroups[role];
                    members.forEach((member, index) => {
                        groupsArray[index % numGroups].push(member);
                    });
                }

                groupsArray.forEach((groupMembers, index) => {
                    container.innerHTML += createTableHTML(`المجموعة (${index + 1}) - موزعة حسب الوظائف`, groupMembers);
                });
            }
        }

        function createTableHTML(title, list) {
            let rows = '';
            list.forEach((p, index) => {
                rows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${p.name}</td>
                        <td>${p.rank}</td>
                        <td>${p.role}</td>
                        <td>${p.notes}</td>
                    </tr>
                `;
            });

            if (list.length === 0) {
                rows = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">لا يوجد عناصر في هذه القائمة</td></tr>`;
            }

            return `
                <div class="section-title">${title} (${list.length})</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الاسم</th>
                                <th>الرتبة</th>
                                <th>التكليف</th>
                                <th>الملاحظات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.onload = () => {
            initExclusionCheckboxes();
            renderStructure('default');
        };

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
