<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الأمطار المباشر - المملكة العربية السعودية</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f172a;
            color: #ffffff;
            overflow: hidden;
        }
        /* الشريط العلوي الاحترافي */
        header {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #334155;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        #time-display {
            font-size: 0.85rem;
            color: #94a3b8;
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        /* الحاوية الرئيسية للخريطة والشريط الزمني السفلي */
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19 !important;
        }
        /* الشريط الزمني السفلي التفاعلي */
        .timeline-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .timeline-bar input[type="range"] {
            flex-grow: 1;
            accent-color: #0ea5e9;
            cursor: pointer;
        }
        /* مفتاح دلائل الأمطار (Legend) */
        .weather-legend {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            z-index: 999;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        .legend-colors {
            display: flex;
            height: 8px;
            width: 120px;
            border-radius: 4px;
            margin-top: 5px;
            background: linear-gradient(to right, #00ff00, #ffff00, #ff0000, #800080);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>🌧️ رادار الأمطار المباشر - السعودية</h1>
        </div>
        <div class="controls-group">
            <span id="time-display">جاري التحميل...</span>
            <button class="btn" id="play-btn" onclick="togglePlay()">تشغيل الحركة ▶</button>
            <button class="btn btn-secondary" onclick="changeSpeed()">السرعة: عادي</button>
            <button class="btn btn-secondary" onclick="loadRadarData()" title="تحديث البيانات">🔄 تحديث</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
        
        <!-- دليل كثافة الأمطار -->
        <div class="weather-legend">
            <div>كثافة الأمطار</div>
            <div class="legend-colors"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 3px;">
                <span>خفيف</span>
                <span>غزير</span>
            </div>
        </div>

        <!-- الشريط الزمني السفلي -->
        <div class="timeline-bar">
            <span id="slider-time" style="font-size: 0.8rem; min-width: 50px;">--:--</span>
            <input type="range" id="time-slider" min="0" max="0" value="0" step="1" oninput="onSliderChange(this.value)">
        </div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ضبط خريطة المملكة العربية السعودية بتركيز احترافي
        const map = L.map('map', {
            zoomControl: false
        }).setView([23.8859, 45.0792], 6);

        // إضافة أزرار التحكم بالتقريب في الزاوية اليمنى السفلى أو اليسرى
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // خريطة أساسية داكنة وأنيقة لا تحتاج مفتاح API
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 18,
            subdomains: 'abcd'
        }).addTo(map);

        let radarLayers = [];
        let timestamps = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;
        let animationSpeed = 700; // السرعة الافتراضية

        // جلب بيانات الرادار الفعلية من RainViewer API
        async function loadRadarData() {
            document.getElementById('time-display').innerText = 'جاري التحديث...';
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                
                const host = data.host;
                const pastFrames = data.radar.past; 

                // إزالة الطبقات القديمة لمنع التداخل
                radarLayers.forEach(layer => map.removeLayer(layer));
                radarLayers = [];
                timestamps = [];

                pastFrames.forEach(frame => {
                    // استخدام الألوان الغنية للرادار (الخيار 2 مع تدرج الطقس)
                    const layer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.75,
                        tileSize: 256
                    });
                    radarLayers.push(layer);
                    timestamps.push(new Date(frame.time * 1000));
                });

                const slider = document.getElementById('time-slider');
                slider.max = radarLayers.length - 1;

                if (radarLayers.length > 0) {
                    showFrame(radarLayers.length - 1);
                }
            } catch (error) {
                document.getElementById('time-display').innerText = 'تعذر جلب البيانات';
                console.error(error);
            }
        }

        // عرض إطار زمني محدد
        function showFrame(index) {
            index = parseInt(index);
            radarLayers.forEach((layer, i) => {
                if (i === index) {
                    if (!map.hasLayer(layer)) layer.addTo(map);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });

            currentIndex = index;
            document.getElementById('time-slider').value = index;

            const timeStr = timestamps[index].toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time-display').innerText = `التوقيت: ${timeStr}`;
            document.getElementById('slider-time').innerText = timeStr;
        }

        // تفاعل شريط التمرير اليدوي
        function onSliderChange(value) {
            if (isPlaying) togglePlay(); // إيقاف التشغيل التلقائي عند التحريك اليدوي
            showFrame(value);
        }

        // تشغيل وإيقاف الحركة التلقائية للسحب
        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(animationInterval);
                btn.innerText = 'تشغيل الحركة ▶';
                isPlaying = false;
            } else {
                btn.innerText = 'إيقاف ⏸';
                isPlaying = true;
                animationInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % radarLayers.length;
                    showFrame(currentIndex);
                }, animationSpeed);
            }
        }

        // تبديل سرعة العرض
        let speedState = 1;
        function changeSpeed() {
            const btnSpeedText = event.target;
            if (speedState === 1) {
                animationSpeed = 350; // سريع جداً
                btnSpeedText.innerText = 'السرعة: سريع 🚀';
                speedState = 2;
            } else {
                animationSpeed = 700; // عادي
                btnSpeedText.innerText = 'السرعة: عادي ⚡';
                speedState = 1;
            }
            if (isPlaying) {
                clearInterval(animationInterval);
                animationInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % radarLayers.length;
                    showFrame(currentIndex);
                }, animationSpeed);
            }
        }

        // التشغيل الأولي وتحديث البيانات تلقائياً كل 5 دقائق
        loadRadarData();
        setInterval(loadRadarData, 5 * 60 * 1000);
    </script>
</body>
</html>
