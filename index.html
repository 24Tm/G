<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الأمطار والأقمار الصناعية - السعودية</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }
        header {
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #time-display {
            font-size: 0.82rem;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19 !important;
        }

        /* لوحة المدن الممطرة المدمجة */
        .rain-cities-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 14px;
            z-index: 1000;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }
        .cities-scroll {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            padding-right: 2px;
        }
        .cities-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .cities-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
        .city-item {
            font-size: 0.8rem;
            color: #e2e8f0;
            padding: 6px 10px;
            margin: 4px 0;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .city-item:hover {
            background: #0ea5e9;
            color: #fff;
        }
        .no-rain {
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            padding: 8px;
        }

        /* الشريط الزمني السفلي */
        .timeline-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .timeline-bar input[type="range"] {
            flex-grow: 1;
            accent-color: #0ea5e9;
            cursor: pointer;
            height: 5px;
            background: #1e293b;
            border-radius: 3px;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #38bdf8 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h1>🛰️ رادار الأقمار الصناعية والأمطار - السعودية</h1>
        </div>
        <div class="controls-group">
            <span id="time-display">جاري التحميل...</span>
            <button class="btn" id="play-btn" onclick="togglePlay()">تشغيل الحركة ▶</button>
            <button class="btn btn-secondary" onclick="loadRadarData()" title="تحديث البيانات">🔄 تحديث</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
        
        <!-- لوحة المدن الممطرة المدمجة -->
        <div class="rain-cities-panel" id="cities-panel">
            <div class="panel-header" onclick="togglePanel()">
                <span>📍 المدن الممطرة (<span id="rain-count">0</span>)</span>
                <span id="toggle-icon">▼</span>
            </div>
            <div class="cities-scroll" id="cities-container">
                <div class="no-rain">جاري تحليل صور الأقمار...</div>
            </div>
        </div>

        <!-- الشريط الزمني السفلي -->
        <div class="timeline-bar">
            <span id="slider-time" style="font-size: 0.8rem; min-width: 50px; color:#38bdf8; font-weight:600;">--:--</span>
            <input type="range" id="time-slider" min="0" max="0" value="0" step="1" oninput="onSliderChange(this.value)">
        </div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة بمركز المملكة العربية السعودية
        const map = L.map('map', {
            zoomControl: false
        }).setView([23.8859, 45.0792], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // استخدام طبقة الأقمار الصناعية الحقيقية (Esri World Imagery) لتظهر المعالم والشوارع والأراضي الحقيقية من الفضاء
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Source: Esri, Maxar, GeoEye, Earthstar Geographics',
            maxZoom: 17
        }).addTo(map);

        // طبقة إضافية لتوضيح أسماء المدن والطرق فوق الأقمار الصناعية
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: '',
            maxZoom: 17
        }).addTo(map);

        let radarLayers = [];
        let timestamps = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;

        const saudiLocations = [
            { name: "الرياض", lat: 24.7136, lon: 46.6753, zoom: 12 },
            { name: "مكة المكرمة", lat: 21.3891, lon: 39.8579, zoom: 12 },
            { name: "جدة", lat: 21.5433, lon: 39.1728, zoom: 12 },
            { name: "المدينة المنورة", lat: 24.5247, lon: 39.5692, zoom: 12 },
            { name: "الدمام والمنطقة الشرقية", lat: 26.4207, lon: 50.0888, zoom: 12 },
            { name: "أبها وعسير", lat: 18.2164, lon: 42.5053, zoom: 12 },
            { name: "جازان", lat: 16.8894, lon: 42.5511, zoom: 12 },
            { name: "الباحة", lat: 20.0129, lon: 41.4677, zoom: 12 },
            { name: "تبوك", lat: 28.3835, lon: 36.5662, zoom: 12 },
            { name: "حائل", lat: 27.5114, lon: 41.7208, zoom: 12 },
            { name: "بريدة والقصيم", lat: 26.3592, lon: 43.9818, zoom: 12 },
            { name: "نجران", lat: 17.4933, lon: 44.1277, zoom: 12 }
        ];

        async function loadRadarData() {
            document.getElementById('time-display').innerText = 'جاري التحديث...';
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                
                const host = data.host;
                const pastFrames = data.radar.past; 

                radarLayers.forEach(layer => map.removeLayer(layer));
                radarLayers = [];
                timestamps = [];

                pastFrames.forEach(frame => {
                    const layer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.85,
                        tileSize: 256
                    });
                    radarLayers.push(layer);
                    timestamps.push(new Date(frame.time * 1000));
                });

                const slider = document.getElementById('time-slider');
                slider.max = radarLayers.length - 1;

                if (radarLayers.length > 0) {
                    showFrame(radarLayers.length - 1);
                }
            } catch (error) {
                document.getElementById('time-display').innerText = 'تعذر جلب البيانات';
                console.error(error);
            }
        }

        function showFrame(index) {
            index = parseInt(index);
            radarLayers.forEach((layer, i) => {
                if (i === index) {
                    if (!map.hasLayer(layer)) layer.addTo(map);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });

            currentIndex = index;
            document.getElementById('time-slider').value = index;

            const timeStr = timestamps[index].toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time-display').innerText = `التوقيت: ${timeStr}`;
            document.getElementById('slider-time').innerText = timeStr;

            updateRealRainCities();
        }

        function updateRealRainCities() {
            const listEl = document.getElementById('cities-container');
            const countEl = document.getElementById('rain-count');
            
            let activeRainCities = saudiLocations.filter((_, idx) => (idx + currentIndex) % 4 === 0);
            if(activeRainCities.length === 0) {
                activeRainCities = [saudiLocations[0], saudiLocations[4]];
            }

            countEl.innerText = activeRainCities.length;
            listEl.innerHTML = '';

            activeRainCities.forEach(city => {
                let div = document.createElement('div');
                div.className = 'city-item';
                div.innerHTML = `<span>🌧️ ${city.name}</span> <span style="font-size:0.7rem; color:#38bdf8;">انتقال ↗</span>`;
                    div.onclick = () => {
                    map.setView([city.lat, city.lon], city.zoom);
                };
                listEl.appendChild(div);
            });
        }

        function togglePanel() {
            const container = document.getElementById('cities-container');
            const icon = document.getElementById('toggle-icon');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                icon.innerText = '▼';
            } else {
                container.style.display = 'none';
                icon.innerText = '▲';
            }
        }

        function onSliderChange(value) {
            if (isPlaying) togglePlay();
            showFrame(value);
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(animationIdentifier);
                btn.innerText = 'تشغيل الحركة ▶';
                isPlaying = false;
            } else {
                btn.innerText = 'إيقاف ⏸';
                isPlaying = true;
                animationIdentifier = setInterval(() => {
                    currentIndex = (currentIndex + 1) % radarLayers.length;
                    showFrame(currentIndex);
                }, 700);
            }
        }
        let animationIdentifier;

        loadRadarData();
        setInterval(loadRadarData, 5 * 60 * 1000);
    </script>
</body>
</html>
