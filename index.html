<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الأقمار الصناعية والموقع المباشر - السعودية</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }
        header {
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19 !important;
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #38bdf8 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h1>🛰️ خريطة الأقمار الصناعية والموقع المباشر</h1>
        </div>
        <div class="controls-group">
            <button class="btn" onclick="locateMe()">📍 موقعي الحالي</button>
            <button class="btn btn-success" onclick="shareLocation()">🔗 مشاركة موقعي</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // قراءة الإحداثيات إذا تم إرسالها عبر رابط المشاركة
        const urlParams = new URLSearchParams(window.location.search);
        const sharedLat = parseFloat(urlParams.get('lat'));
        const sharedLon = parseFloat(urlParams.get('lon'));

        let initialCenter = [23.8859, 45.0792]; // مركز السعودية الافتراضي
        let initialZoom = 6;

        if (!isNaN(sharedLat) && !isNaN(sharedLon)) {
            initialCenter = [sharedLat, sharedLon];
            initialZoom = 17; // تقريب فائق على الموقع المشارك
        }

        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 19,
            minZoom: 4
        }).setView(initialCenter, initialZoom);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // طبقة الأقمار الصناعية فائقة الدقة
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 18
        }).addTo(map);

        // طبقة أسماء الشوارع والمعالم فوق الأقمار الصناعية
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 18
        }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;

        // إذا تم فتح الرابط المشارك، ضع علامة على الموقع المستهدف
        if (!isNaN(sharedLat) && !isNaN(sharedLon)) {
            userMarker = L.marker([sharedLat, sharedLon]).addTo(map)
                .bindPopup("<b>📍 الموقع المشارك المستهدف</b>").openPopup();
        }

        // تحديث الموقع الحالي بالتزامن مع الحركة
        function locateMe() {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع الجغرافي");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                if (userMarker) {
                    userMarker.setLatLng([lat, lon]);
                    accuracyCircle.setLatLng([lat, lon]);
                    accuracyCircle.setRadius(accuracy);
                } else {
                    userMarker = L.marker([lat, lon]).addTo(map).bindPopup("📍 أنت هنا").openPopup();
                    accuracyCircle = L.circle([lat, lon], { radius: accuracy, color: '#0ea5e9', fillColor: '#38bdf8', fillOpacity: 0.2 }).addTo(map);
                }

                map.setView([lat, lon], 17); // تقريب فائق على موقعك الحالي
            }, error => {
                alert("تعذر الحصول على موقعك. تأكد من السماح للمتصفح بالصلاحية.");
            }, { enableHighAccuracy: true });
        }

        // مشاركة الموقع الحالي عبر رابط مباشر
        function shareLocation() {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                const shareUrl = `${window.location.origin}${window.location.pathname}?lat=${lat}&lon=${lon}`;
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        alert("تم نسخ رابط موقعك بنجاح! 🔗\nأرسله لأي شخص، وعندما يضغط عليه سيتوجه مباشرة إلى موقعك على الخريطة.");
                    });
                } else {
                    prompt("انسخ هذا الرابط وأرسله لشخص آخر:", shareUrl);
                }
            }, error => {
                alert("يرجى تفعيل تحديد الموقع أولاً للحصول على إحداثياتك.");
            }, { enableHighAccuracy: true });
        }

        // التتبع التلقائي لموقعك بالتزامن إذا سمح المستخدم
        if (navigator.geolocation && isNaN(sharedLat)) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                if (userMarker) {
                    userMarker.setLatLng([lat, lon]);
                    accuracyCircle.setLatLng([lat, lon]);
                    accuracyCircle.setRadius(accuracy);
                }
            }, null, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }
    </script>
</body>
</html>
