<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الأقمار الصناعية فائقة الدقة - السعودية</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }
        header {
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19 !important;
        }

        /* إخفاء حقوق الطبع والنشر لتصبح الخريطة نظيفة تماماً */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* لوحة الانتقال السريع للمدن */
        .cities-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 14px;
            z-index: 1000;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .panel-header {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
            margin-bottom: 8px;
            text-align: center;
        }
        .cities-scroll {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .cities-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .cities-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
        .city-item {
            font-size: 0.8rem;
            color: #e2e8f0;
            padding: 6px 10px;
            margin: 4px 0;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .city-item:hover {
            background: #0ea5e9;
            color: #fff;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #38bdf8 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h1>🛰️ خرائط الأقمار الصناعية فائقة الدقة - السعودية</h1>
        </div>
        <div class="controls-group">
            <button class="btn" onclick="resetMap()">إعادة ضبط الخريطة 🌍</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
        
        <!-- لوحة المدن والمناطق -->
        <div class="cities-panel">
            <div class="panel-header">📍 اختر مدينة للتقريب السريع</div>
            <div class="cities-scroll" id="cities-container"></div>
        </div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة على مركز المملكة العربية السعودية مع تفعيل التقريب الحر
        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 19,
            minZoom: 4
        }).setView([23.8859, 45.0792], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // أقوى طبقة أقمار صناعية عالمية فائقة الدقة (بدون أي علامات مائية أو قيود مزعجة)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 18
        }).addTo(map);

        // طبقة أسماء الشوارع والمعالم فوق الأقمار الصناعية
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 18
        }).addTo(map);

        const saudiLocations = [
            { name: "الرياض", lat: 24.7136, lon: 46.6753, zoom: 16 },
            { name: "مكة المكرمة", lat: 21.3891, lon: 39.8579, zoom: 16 },
            { name: "جدة", lat: 21.5433, lon: 39.1728, zoom: 16 },
            { name: "المدينة المنورة", lat: 24.5247, lon: 39.5692, zoom: 16 },
            { name: "الدمام", lat: 26.4207, lon: 50.0888, zoom: 16 },
            { name: "أبها", lat: 18.2164, lon: 42.5053, zoom: 16 },
            { name: "تبوك", lat: 28.3835, lon: 36.5662, zoom: 16 },
            { name: "حائل", lat: 27.5114, lon: 41.7208, zoom: 16 },
            { name: "بريدة", lat: 26.3592, lon: 43.9818, zoom: 16 },
            { name: "جازان", lat: 16.8894, lon: 42.5511, zoom: 16 }
        ];

        const container = document.getElementById('cities-container');
        saudiLocations.forEach(city => {
            let div = document.createElement('div');
            div.className = 'city-item';
            div.innerHTML = `<span>🏙️ ${city.name}</span> <span style="font-size:0.7rem; color:#38bdf8;">تقريب ↗</span>`;
            div.onclick = () => {
                map.setView([city.lat, city.lon], city.zoom);
            };
            container.appendChild(div);
        });

        function resetMap() {
            map.setView([23.8859, 45.0792], 6);
        }
    </script>
</body>
</html>
