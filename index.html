<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الأقمار الصناعية - أقصى وضوح وتقريب فائق</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }
        header {
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .main-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19 !important;
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #38bdf8 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e293b !important;
        }
        
        /* تصميم نافذة الدبوس الفاخرة */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #0f172a !important;
            color: #ffffff !important;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .leaflet-popup-content b {
            color: #38bdf8;
        }
        .share-popup-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 6px;
            width: 100%;
            font-size: 0.8rem;
        }
        .share-popup-btn:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h1>🛰️ أقمار صناعية - أقصى وضوح فائق</h1>
        </div>
        <div class="controls-group">
            <button class="btn" onclick="locateMe()">📍 موقعي الحالي</button>
        </div>
    </header>

    <div class="main-container">
        <div id="map"></div>
    </div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // قراءة الإحداثيات إذا تم مشاركتها عبر الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const sharedLat = parseFloat(urlParams.get('lat'));
        const sharedLon = parseFloat(urlParams.get('lon'));

        let initialCenter = [23.8859, 45.0792]; // مركز السعودية الافتراضي
        let initialZoom = 6;

        if (!isNaN(sharedLat) && !isNaN(sharedLon)) {
            initialCenter = [sharedLat, sharedLon];
            initialZoom = 18; // تقريب فائق جداً على الموقع المشارك
        }

        // تفعيل أقصى مستوى تقريب حر (Max Zoom 19)
        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 19,
            minZoom: 3
        }).setView(initialCenter, initialZoom);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // طبقة الأقمار الصناعية الفائقة المعززة بأقصى دقة عرض
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 18,
            subdomains: ['server', 'services']
        }).addTo(map);

        let currentMarker = null;

        // إذا تم فتح رابط مشاركة، ضع دبوساً فورياً على الموقع
        if (!isNaN(sharedLat) && !isNaN(sharedLon)) {
            setPin(sharedLat, sharedLon, "📍 الموقع المُشار إليه");
        }

        // النقر على الخريطة لوضع دبوس في أي مكان وبدقة متناهية
        map.on('click', function(e) {
            setPin(e.latlng.lat, e.latlng.lng, "📍 الموقع المحدّد");
        });

        function setPin(lat, lon, title) {
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            const popupContent = `
                <div style="text-align: center;">
                    <b>${title}</b><br>
                    <span style="font-size: 0.75rem; color: #94a3b8;">(${lat.toFixed(5)}, ${lon.toFixed(5)})</span><br>
                    <button class="share-popup-btn" onclick="shareSpecificLocation(${lat}, ${lon})">🔗 مشاركة هذا الموقع</button>
                </div>
            `;

            currentMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(popupContent)
                .openPopup();
        }

        // وظيفة نسخ رابط الموقع المحدد لمشاركته
        window.shareSpecificLocation = function(lat, lon) {
            const shareUrl = `${window.location.origin}${window.location.pathname}?lat=${lat}&lon=${lon}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("تم نسخ رابط الموقع بدقة فائقة! 🔗\nأرسله لصديقك وسيتجه مباشرة لهذه النقطة بدقة متناهية.");
                });
            } else {
                prompt("انسخ هذا الرابط وأرسله:", shareUrl);
            }
        };

        // تحديد موقعك الحالي بدقة عالية عبر الـ GPS
        function locateMe() {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم تحديد الموقع");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                map.setView([lat, lon], 18); // تقريب فائق جداً على مكانك
                setPin(lat, lon, "📍 أنت هنا (موقعك الحالي)");
            }, error => {
                alert("تعذر الوصول لموقعك. تأكد من السماح للمتصفح بالصلاحية.");
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
